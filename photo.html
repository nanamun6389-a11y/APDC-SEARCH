<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>APDC Gallery</title>
  <link rel="stylesheet" href="photo.css?v=20260811-4">
</head>
<body>
<header class="photo-header public-header">
  <a href="index.html" class="back-link" aria-label="뒤로가기">← BACK</a>
  <div class="gallery-title">
    <div class="eyebrow">2026 ASIA PACIFIC DANCESPORT CHAMPIONSHIP</div>
    <h1>GALLERY</h1>
  </div>
</header>

<main class="gallery-wrap">
  <div class="gallery-note">APDC 2026 · PHOTOS & VIDEOS · SEOUL</div>
  <div id="publicPhotoGrid" class="public-photo-grid"></div>
  <div id="galleryLoading" class="empty-state">사진과 동영상을 불러오는 중입니다.</div>
  <div id="galleryEmpty" class="empty-state hidden">아직 공개된 사진이나 동영상이 없습니다.</div>
</main>

<button id="openUpload" class="floating-admin" type="button" aria-label="갤러리 관리자">ADMIN</button>
<button id="scrollTop" class="floating-top" type="button" aria-label="맨 위로 이동">↑</button>

<div id="selectionBar" class="selection-bar hidden">
  <span><strong id="selectedCount">0</strong>장 선택</span>
  <button id="clearSelection" type="button">선택 해제</button>
  <button id="downloadSelected" type="button">선택 사진 다운로드</button>
</div>

<div id="uploadPanel" class="upload-panel hidden" role="dialog" aria-modal="true" aria-label="Gallery upload">
  <div class="upload-sheet">
    <button id="closeUpload" class="panel-back" type="button">← BACK TO GALLERY</button>

    <section id="uploadPasswordGate" class="upload-section">
      <div class="small-label">UPLOAD ACCESS</div>
      <h2>ENTER PASSWORD</h2>
      <input id="galleryPassword" type="password" autocomplete="off" placeholder="Password">
      <button id="unlockUpload" class="primary-btn" type="button">ENTER</button>
      <div id="passwordMessage" class="message"></div>
    </section>

    <section id="uploadControls" class="upload-section hidden">
      <div class="small-label">UPLOAD</div>
      <h2>ADD PHOTOS & VIDEOS</h2>
      <label class="file-picker" for="galleryFiles">
        <strong>사진 · 동영상 선택</strong>
        <span>여러 파일을 한 번에 선택할 수 있습니다.</span>
      </label>
      <input id="galleryFiles" type="file" accept="image/*,video/*" multiple hidden>
      <input id="galleryCaption" type="text" maxlength="80" placeholder="캡션 (선택)">
      <button id="galleryUploadBtn" type="button" class="primary-btn" disabled>UPLOAD</button>
      <div id="selectedInfo" class="selected-info">선택된 파일 없음</div>
      <div id="uploadProgress" class="progress-wrap hidden"><div id="uploadProgressBar"></div></div>
      <div id="uploadMessage" class="message"></div>
    </section>
  </div>
</div>

<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Media preview">
  <button id="lightboxClose" class="lightbox-back" type="button">← BACK</button>
  <img id="lightboxImage" class="hidden" alt="APDC photo">
  <video id="lightboxVideo" class="hidden" controls playsinline preload="metadata"></video>
  <div id="lightboxCaption" class="lightbox-caption"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="photo.js?v=20260811-4"></script>
</body>
</html>
