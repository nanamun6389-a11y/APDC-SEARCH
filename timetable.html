<!doctype html>

<title>APDC Timetable</title>
<link rel="stylesheet" href="timetable-judge.css?v=20260727-live-sync-v4">

<body>
<header style="position:relative"><a class="brand brand-link" href="index.html">2026 APDC</a></header>
<nav class="top-category-nav apdc-main-nav">

<main>
<section id="ttPasswordGate" class="password-gate">
  <div class="password-box">
    <div class="small-label">APDC TIMETABLE ACCESS</div>
    <h1>ENTER PASSWORD</h1>
    <input id="ttPasswordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" aria-label="Timetable password">
    <button id="ttPasswordBtn" type="button">ENTER</button>
    <div id="ttPasswordMessage" class="message"></div>
  </div>
</section>
<section id="ttProtected" class="hidden">
  <div class="tt-head">
    <div>
      <div class="small-label">2026 ASIA PACIFIC DANCESPORT CHAMPIONSHIP</div>
      <h1>TIMETABLE</h1>
      <p id="ttSummary" class="muted"></p>
    </div>
    <div class="tt-tools"><input id="ttSearch" type="search" placeholder="Search back number / player name"><button id="ttNowBtn" class="light" type="button">NOW</button></div>
  </div>
  <div id="ttCards" class="tt-cards"><div class="message">LOADING TIMETABLE…</div></div>
</section>
</main>
