<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>APDC Timetable</title>
<link rel="stylesheet" href="timetable-judge.css?v=20260727-public-live-v2">
</head>
<body>
<header style="position:relative"><a class="brand brand-link" href="index.html">APDC 2026</a></header>
<main>
<section id="ttPasswordGate" class="password-gate">
  <div class="password-box">
    <div class="small-label">APDC TIMETABLE ACCESS</div>
    <h1>ENTER PASSWORD</h1>
    <input id="ttPasswordInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <button id="ttPasswordBtn" type="button">ENTER</button>
    <div id="ttPasswordMessage" class="message"></div>
  </div>
</section>
<section id="ttProtected" class="hidden" hidden style="display:none">
  <div class="tt-head">
    <div>
      <div class="small-label">APDC 2026 · OFFICIAL SCHEDULE</div>
      <h1>TIMETABLE</h1>
      <p id="ttSummary" class="muted"></p>
    </div>
    <div class="tt-tools"><input id="ttSearch" type="search" enterkeyhint="search" placeholder="Search back number / player name"><button id="ttSearchBtn" class="dark" type="button">SEARCH</button></div>
  </div>
  <section id="ttLiveNow" class="tt-live-now" aria-live="polite">
    <div class="tt-live-label"><span class="tt-live-dot"></span> LIVE NOW</div>
    <div class="tt-live-event">
      <strong id="ttLiveEvent">WAITING</strong>
      <span id="ttLiveRound"></span>
    </div>
  </section>
  <div id="ttCards" class="tt-cards"></div>
</section>
</main>
<script src="i18n.js?v=20260717-1305"></script>
<script type="module" src="timetable.js?v=20260727-public-live-v2"></script>
</body>
</html>
