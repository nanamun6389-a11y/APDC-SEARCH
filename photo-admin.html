<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>APDC Media Admin</title>
  <link rel="stylesheet" href="photo.css?v=20260811-2">
</head>
<body>
<header class="photo-header">
  <div>
    <div class="eyebrow">2026 APDC</div>
    <h1>MEDIA ADMIN</h1>
  </div>
  <a href="photo.html" class="top-link">GALLERY</a>
</header>
<main class="photo-admin-wrap">
  <section id="photoLogin" class="admin-card login-card">
    <div class="small-label">ADMIN ACCESS</div>
    <h2>FIREBASE ADMIN LOGIN</h2>
    <input id="photoEmail" type="email" autocomplete="username" placeholder="Admin email">
    <input id="photoPassword" type="password" autocomplete="current-password" placeholder="Password">
    <button id="photoLoginBtn" type="button">SIGN IN</button>
    <div id="photoLoginMessage" class="message"></div>
  </section>

  <div id="photoDashboard" class="hidden">
    <section class="admin-card upload-card">
      <div class="section-title">
        <div>
          <div class="small-label">UPLOAD</div>
          <h2>ADD PHOTOS & VIDEOS</h2>
        </div>
        <span id="photoCount" class="count-badge">0</span>
      </div>
      <label class="file-picker" for="photoFiles">
        <strong>사진 · 동영상 선택</strong>
        <span>여러 파일을 한 번에 선택할 수 있습니다. MP4/MOV/WebM 지원.</span>
      </label>
      <input id="photoFiles" type="file" accept="image/*,video/mp4,video/quicktime,video/webm,video/*" multiple hidden>
      <input id="photoCaption" type="text" maxlength="80" placeholder="캡션 (선택) — 예: APDC 2026 Highlights">
      <button id="uploadPhotosBtn" type="button" class="primary-btn" disabled>UPLOAD</button>
      <div id="selectedInfo" class="selected-info">선택된 파일 없음</div>
      <div id="uploadProgress" class="progress-wrap hidden"><div id="uploadProgressBar"></div></div>
      <div id="uploadMessage" class="message"></div>
      <div class="storage-note">동영상은 Firebase Storage에 저장됩니다. 큰 영상은 Wi-Fi 업로드를 권장합니다.</div>
    </section>

    <section class="admin-card">
      <div class="section-title">
        <div>
          <div class="small-label">MANAGE</div>
          <h2>UPLOADED MEDIA</h2>
        </div>
        <div class="admin-actions">
          <button id="refreshPhotos" type="button" class="small-btn">REFRESH</button>
          <button id="photoLogoutBtn" type="button" class="small-btn">SIGN OUT</button>
        </div>
      </div>
      <div id="adminPhotoGrid" class="admin-photo-grid"></div>
      <div id="adminEmpty" class="empty-state hidden">아직 업로드된 사진이나 동영상이 없습니다.</div>
    </section>
  </div>
</main>
<script type="module" src="photo-admin.js?v=20260811-2"></script>
</body>
</html>
